<!DOCTYPE html>
<html>
<head>

<body>
<x-dc>
<section style="font-family:'Outfit',system-ui,sans-serif;background:radial-gradient(700px 360px at 20% 60%,#dff3d2 0%,transparent 70%),linear-gradient(180deg,#eef8ea,#f7fcf4);overflow:hidden">

      <div style="position:absolute;left:70px;bottom:22px;width:300px;height:196px;transform:perspective(900px) rotateY(14deg) rotateZ(-6deg);transform-origin:bottom center">

            <div style="display:flex;gap:5px;align-items:center"><span style="width:7px;height:7px;border-radius:50%;background:#ff6b6b"></span><span style="width:7px;height:7px;border-radius:50%;background:#ffc94d"></span><span style="width:7px;height:7px;border-radius:50%;background:#4cd964"></span><span style="margin-left:8px;font-size:9px;font-weight:700;color:#1f8a3b">DashPatrol</span></div>
            <div style="flex:1;display:flex;align-items:flex-end;gap:10px;padding:0 12px;border-bottom:1.5px solid #e3ebe0">
              <span style="width:20px;height:30%;border-radius:3px 3px 0 0;background:#9be27a"></span><span style="width:20px;height:48%;border-radius:3px 3px 0 0;background:#6fd055"></span><span style="width:20px;height:42%;border-radius:3px 3px 0 0;background:#4cbd47"></span><span style="width:20px;height:70%;border-radius:3px 3px 0 0;background:#2fa83e"></span><span style="width:20px;height:90%;border-radius:3px 3px 0 0;background:#1f8a3b"></span>
            </div>
          </div>
        </div>
        <div style="position:absolute;left:-26px;right:-26px;bottom:-14px;height:16px;border-radius:0 0 18px 18px;background:linear-gradient(180deg,#d9dee4,#aab3bd)"></div>
      </div>
      <div style="position:absolute;left:250px;top:30px;width:170px;padding:14px;border-radius:14px;background:#fff;box-shadow:0 18px 40px rgba(10,60,25,0.18);display:flex;flex-direction:column;gap:10px;transform:rotate(-4deg)">
        <svg width="34" height="34" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path></svg>
        <span style="height:8px;width:90%;border-radius:4px;background:#d9e1ea"></span>
        <span style="height:8px;width:70%;border-radius:4px;background:#e6ecf2"></span>
      </div>
    </div>
    </div>
    <div style="position:relative;display:flex;flex-direction:column;gap:14px">
      <svg width="44" height="34" viewBox="0 0 44 34" style="position:absolute;right:8%;top:-24px"><path d="M6 4 L10 18" stroke="#22a447" stroke-width="4" stroke-linecap="round"></path><path d="M20 22 L36 12" stroke="#22a447" stroke-width="4" stroke-linecap="round"></path></svg>

      <p style="margin:0;font-size:18px;line-height:1.5;color:#33433a;max-width:480px">Get more customers, higher rankings, and a site that keeps improving — automatically.</p>
      <div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:8px">
        <a href="Start%20Free%20Trial.dc.html" style="padding:16px 44px;border-radius:12px;background:linear-gradient(180deg,#1f7a39,#0f5a28);color:#fff;font-size:17px;font-weight:700;text-decoration:none;box-shadow:0 10px 24px rgba(15,90,40,0.3)" style-hover="filter:brightness(1.1);color:#fff">Start Your Free Trial →</a>

      </div>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { s: 1 };
  boxRef = React.createRef();
  measure = () => { const el = this.boxRef.current; if (!el) return; const s = Math.min(1, el.clientWidth / 430); if (Math.abs(s - this.state.s) > 0.005) this.setState({ s }); };
  componentDidMount() { this.ro = new ResizeObserver(this.measure); if (this.boxRef.current) this.ro.observe(this.boxRef.current); this.measure(); }
  componentWillUnmount() { this.ro && this.ro.disconnect(); }
  renderVals() { return { boxRef: this.boxRef, scale: this.state.s, boxH: Math.round(250 * this.state.s) + 'px' }; }
}
</script>
</body>
</html>
