<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section style="position:relative;overflow:hidden;font-family:'Outfit',system-ui,sans-serif;color:#fff;background:radial-gradient(900px 500px at 85% 20%,#13843c 0%,transparent 60%),radial-gradient(700px 400px at 5% 0%,#0d5a2a 0%,transparent 60%),linear-gradient(180deg,#06341a,#0a4a24)">
  <div style="max-width:1000px;margin:0 auto;padding:56px 32px 120px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px;position:relative;z-index:2">
    <span style="display:inline-flex;padding:8px 18px;border-radius:999px;background:#1f8a3b;border:1px solid rgba(143,227,59,0.45);font-weight:600;font-size:14px;letter-spacing:0.04em;text-transform:uppercase">{{ eyebrow }}</span>
    <h1 style="margin:0;font-size:clamp(40px,5.4vw,68px);line-height:1.04;font-weight:800;letter-spacing:-0.025em;text-wrap:balance">{{ title }} <span style="color:#a6f04f;font-style:italic">{{ accent }}</span></h1>
    <p style="margin:0;font-size:19px;line-height:1.55;color:rgba(255,255,255,0.88);max-width:680px;text-wrap:pretty">{{ sub }}</p>
  </div>
  <svg viewBox="0 0 1440 140" preserveAspectRatio="none" style="position:absolute;left:0;right:0;bottom:-1px;width:100%;height:110px;z-index:1"><defs><linearGradient id="phw" x1="0" x2="1"><stop offset="0" stop-color="#2fa83e"></stop><stop offset="1" stop-color="#a6f04f"></stop></linearGradient></defs><path d="M0 90 C 400 40 900 130 1440 30 L1440 140 L0 140 Z" fill="url(#phw)" opacity="0.9"></path><path d="M0 110 C 420 60 920 150 1440 60 L1440 140 L0 140 Z" fill="#ffffff"></path></svg>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;eyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Benefits&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Title&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Accent.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
