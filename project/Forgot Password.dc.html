<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Reset Password — DashPatrol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>@view-transition{navigation:auto}html{background:#06341a}*{box-sizing:border-box}body{margin:0;font-family:'Outfit',system-ui,sans-serif;color:#0b1f12;background:#06341a;-webkit-font-smoothing:antialiased}a{color:#1f8a3b;text-decoration:none}a:hover{color:#0f6b2f}</style>
</helmet>
<dc-import name="Nav" active="signin" hint-size="100%,62px"></dc-import>
<section style="background:radial-gradient(900px 600px at 50% 20%,#15893e 0%,transparent 60%),linear-gradient(180deg,#06341a,#0a4a24);padding:64px 24px 80px">
  <div style="max-width:500px;margin:0 auto;padding:34px;border-radius:22px;background:linear-gradient(180deg,#ffffff,#f3faef);box-shadow:0 0 0 6px rgba(255,255,255,0.18),0 40px 80px rgba(0,0,0,0.35)">
    <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:16px 0">
        <span style="width:76px;height:76px;border-radius:50%;background:linear-gradient(180deg,#2fa83e,#0f6b2f);display:grid;place-items:center"><svg width="36" height="36" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="#c8f59a" stroke-width="2"></rect><path d="M4 7 L12 13 L20 7" fill="none" stroke="#c8f59a" stroke-width="2" stroke-linejoin="round"></path></svg></span>
        <h2 style="margin:0;font-size:28px;font-weight:800">Check your inbox</h2>
        <p style="margin:0;font-size:16px;line-height:1.5;color:#33433a">If an account exists for {{ email }}, we sent a link to reset your password. It expires in 30 minutes.</p>
        <a href="Sign%20In.dc.html" style="padding:14px 28px;border-radius:12px;background:#0f6b2f;color:#fff;font-size:16px;font-weight:700;text-decoration:none">Back to Sign In</a>
        <button onClick="{{ reset }}" style="border:none;background:none;color:#1f8a3b;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer">Use a different email</button>
      </div>
    </sc-if>
    <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
      <form onSubmit="{{ submit }}" style="display:flex;flex-direction:column;gap:16px">
        <div><h1 style="margin:0 0 6px;font-size:30px;font-weight:800;letter-spacing:-0.01em">Reset your password</h1><p style="margin:0;font-size:15px;line-height:1.5;color:#33433a">Enter the email you signed up with and we'll send you a reset link.</p></div>
        <label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600">Email<input type="email" value="{{ email }}" onChange="{{ onEmail }}" placeholder="you@business.com" style="padding:13px 14px;border-radius:12px;border:1.5px solid #d6e5d1;background:#fff;font-family:inherit;font-size:16px;outline:none;color:#0b1f12"><span style="font-size:13px;font-weight:500;color:#c0392b">{{ err }}</span></label>
        <button type="submit" style="padding:15px;border-radius:12px;border:none;background:linear-gradient(180deg,#1f7a39,#0f5a28);color:#fff;font-family:inherit;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 10px 24px rgba(15,90,40,0.3)">{{ submitLabel }}</button>
        <p style="margin:0;text-align:center;font-size:14px;color:#33433a">Remembered it? <a href="Sign%20In.dc.html" style="color:#1f8a3b;font-weight:700">Sign in</a></p>
      </form>
    </sc-if>
  </div>
</section>
<dc-import name="Footer" hint-size="100%,300px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { email: '', err: '', loading: false, sent: false };
  renderVals() {
    const s = this.state;
    return { ...s, notSent: !s.sent, submitLabel: s.loading ? 'Sending…' : 'Send Reset Link →',
      onEmail: e => this.setState({ email: e.target.value, err: '' }),
      submit: e => {
        e.preventDefault();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s.email)) return this.setState({ err: 'Enter a valid email address.' });
        this.setState({ loading: true });
        setTimeout(() => this.setState({ loading: false, sent: true }), 800);
      },
      reset: () => this.setState({ sent: false, email: '' }) };
  }
}
</script>
</body>
</html>
