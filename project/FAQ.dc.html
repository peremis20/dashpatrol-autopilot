<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>FAQ — DashPatrol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>@view-transition{navigation:auto}html{background:#06341a}*{box-sizing:border-box}body{margin:0;font-family:'Outfit',system-ui,sans-serif;color:#0b1f12;background:#06341a;-webkit-font-smoothing:antialiased}a{color:#1f8a3b;text-decoration:none}a:hover{color:#0f6b2f}</style>
</helmet>
<dc-import name="Nav" active="faq" hint-size="100%,62px"></dc-import>
<dc-import name="PageHero" eyebrow="FAQ" title="Questions? We have" accent="answers." sub="Everything owners ask before they let DashPatrol work on their site. Can't find yours? Send us a message from the Contact page." hint-size="100%,380px"></dc-import>
<section style="background:linear-gradient(180deg,#ffffff,#f7fcf4);padding:6px 32px 64px">
  <div style="max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px">
    <div style="display:flex;align-items:center;gap:10px;padding:6px 6px 6px 18px;border-radius:14px;background:#fff;border:1.5px solid #d6e5d1;box-shadow:0 8px 24px rgba(16,80,36,0.06)">
      <svg width="20" height="20" viewBox="0 0 24 24"><circle cx="10" cy="10" r="7" fill="none" stroke="#1f8a3b" stroke-width="2.4"></circle><path d="M15 15 L21 21" stroke="#1f8a3b" stroke-width="2.6" stroke-linecap="round"></path></svg>
      <input value="{{ query }}" onChange="{{ onQuery }}" placeholder="Search questions…" style="flex:1;min-width:0;border:none;outline:none;padding:12px 4px;font-family:inherit;font-size:16px;background:transparent;color:#0b1f12">
    </div>
    <sc-for list="{{ items }}" as="q" hint-placeholder-count="8">
      <div style="border-radius:14px;background:#fff;border:1px solid {{ q.border }};overflow:hidden;box-shadow:0 6px 20px rgba(16,80,36,0.06)">
        <button onClick="{{ q.toggle }}" style="width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 22px;border:none;background:transparent;font-family:inherit;font-size:18px;font-weight:700;color:#0b1f12;cursor:pointer;text-align:left"><span style="display:flex;flex-direction:column;gap:6px"><span style="align-self:flex-start;padding:3px 12px;border-radius:999px;background:#e3f6d6;color:#0f6b2f;font-size:13px;font-weight:600">{{ q.cat }}</span>{{ q.q }}</span><span style="width:30px;height:30px;border-radius:50%;background:#e3f6d6;color:#0f6b2f;display:grid;place-items:center;flex-shrink:0"><svg width="14" height="14" viewBox="0 0 14 14" style="transform:rotate({{ q.rot }});transition:transform 0.2s"><path d="M7 1 V13 M1 7 H13" stroke="#13793a" stroke-width="2.4" stroke-linecap="round"></path></svg></span></button>
        <sc-if value="{{ q.open }}" hint-placeholder-val="{{ false }}"><div style="padding:0 22px 20px;font-size:15px;line-height:1.6;color:#33433a">{{ q.a }}</div></sc-if>
      </div>
    </sc-for>
    <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}"><div style="padding:28px;text-align:center;border-radius:14px;background:#fff;border:1px dashed #cfe3c8;font-size:16px;color:#33433a">No questions match that search. Try another word, or <a href="Contact.dc.html" style="color:#13793a;font-weight:700">contact us</a>.</div></sc-if>
  </div>
</section>
<dc-import name="StatsBand" hint-size="100%,190px"></dc-import>
<dc-import name="CTA" hint-size="100%,320px"></dc-import>
<dc-import name="Footer" hint-size="100%,300px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
const FAQS = [
  { cat: 'General', q: 'What exactly does DashPatrol do?', a: 'It does the weekly work of an SEO team: finds what people search for, improves your pages, writes articles you approve, adds internal links, fixes broken links and reports on what changed.' },
  { cat: 'General', q: 'Do I need to know anything about SEO?', a: 'No. DashPatrol explains everything in plain words. You only decide which articles to publish, and even that can be automatic if you prefer.' },
  { cat: 'General', q: 'How soon will I see results?', a: 'Fixes and page improvements often show movement within a few weeks. Bigger gains from new articles usually build over two to three months.' },
  { cat: 'Setup', q: 'Which platforms does it work with?', a: 'Shopify, WordPress, Webflow and Wix connect in one click. Any other website works too through a simple connection or by copying in suggested changes.' },
  { cat: 'Setup', q: 'How long does setup take?', a: 'Most owners are connected in under ten minutes. DashPatrol starts its first site scan right away.' },
  { cat: 'Setup', q: 'Do I need Google Search Console?', a: 'It helps a lot, since it lets DashPatrol measure real results. If you don\u2019t have it yet, we walk you through setting it up for free.' },
  { cat: 'Safety', q: 'Can DashPatrol break my site?', a: 'Every change is logged and can be undone in one click, putting your page back exactly as it was. A second AI checks every plan and article before it counts.' },
  { cat: 'Safety', q: 'Will it publish anything without asking?', a: 'Not unless you allow it. By default, new articles wait for your approval. You control what goes live.' },
  { cat: 'Safety', q: 'What happens to my data?', a: 'Your data is only ever used to improve your own site. It is never sold or used to train models for anyone else.' },
  { cat: 'Pricing', q: 'Is it free right now?', a: 'Yes. During early access every Growth feature is free, and no credit card is required.' },
  { cat: 'Pricing', q: 'Can I cancel anytime?', a: 'Yes, with no contracts or fees. Your improvements stay on your site after you leave.' }
];
class Component extends DCLogic {
  state = { cat: 'All', open: 0, query: '' };
  renderVals() {
    const { cat, open, query } = this.state;
    const cats = ['All', 'General', 'Setup', 'Safety', 'Pricing'].map(label => {
      const on = cat === label;
      return { label, bg: on ? '#0f6b2f' : '#fff', color: on ? '#fff' : '#0b1f12', border: on ? '#0f6b2f' : '#d6e5d1', pick: () => this.setState({ cat: label, open: -1 }) };
    });
    const ql = query.trim().toLowerCase();
    const items = FAQS.map((f, i) => ({ ...f, i })).filter(f => (cat === 'All' || f.cat === cat) && (!ql || (f.q + ' ' + f.a).toLowerCase().includes(ql)))
      .map(f => ({ ...f, catU: f.cat.toUpperCase(), open: open === f.i, rot: open === f.i ? '45deg' : '0deg', border: open === f.i ? '#a6dd8a' : '#dcebd6',
        toggle: () => this.setState(s => ({ open: s.open === f.i ? -1 : f.i })) }));
    return { cats, items, empty: items.length === 0, query, onQuery: e => this.setState({ query: e.target.value }) };
  }
}
</script>
</body>
</html>
